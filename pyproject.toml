[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymetaaudio"
version = "2.2.1"
description = "Editor seguro de metadados, identificação musical e ferramentas de extração de áudio"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "olverclock"}]
dependencies = [
  "mutagen>=1.48.1,<2",
  "customtkinter>=6.0.0,<7",
  "Pillow>=10.4.0,<12",
  "yt-dlp[default,deno]>=2026.8.19",
]


[project.optional-dependencies]
lyrics = [
  "faster-whisper>=1.2.1,<2",
]

[project.scripts]
pymetaaudio = "pymetaaudio.gui:main"
pymetaaudio-doctor = "pymetaaudio.doctor:main"

[tool.setuptools.packages.find]
include = ["pymetaaudio*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
